# Formal-study NAS deployment. One Empirica process owns Tajriba, callbacks,
# the participant client, and the same-origin /query endpoint. Remote ingress is
# intentionally out of scope until its separate security/data-flow gate passes.

name: delibra

services:
  empirica:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        DELIBRA_UID: ${DELIBRA_UID:?set DELIBRA_UID in infra/.env}
        DELIBRA_GID: ${DELIBRA_GID:?set DELIBRA_GID in infra/.env}
    image: delibra-nas:${DELIBRA_IMAGE_TAG:?set DELIBRA_IMAGE_TAG in infra/.env}
    container_name: delibra-empirica
    restart: unless-stopped
    init: true
    stop_signal: SIGINT
    stop_grace_period: 45s
    env_file:
      - ${DELIBRA_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in infra/.env}
      OPENAI_MODEL: ${OPENAI_MODEL:?set OPENAI_MODEL in infra/.env}
      LLM_API_ENDPOINT: ${LLM_API_ENDPOINT:?set LLM_API_ENDPOINT in infra/.env}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:?set LLM_MAX_OUTPUT_TOKENS in infra/.env}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in infra/.env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in infra/.env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      # D-014: research-data export server
      EXPORT_PORT: ${EXPORT_PORT:-3001}
      EXPORT_AUDIT_FILE: ${EXPORT_AUDIT_FILE:-/data/export-audit.jsonl}
      DELIBRA_DISABLE_EXPORT_SERVER: ${DELIBRA_DISABLE_EXPORT_SERVER:-0}
    command:
      - serve
      - /opt/delibra/delibra.tar.zst
      - --config
      - /run/secrets/empirica.toml
      - --addr
      - :3000
      - --tajriba.store.file
      - /data/tajriba.json
      - --callbacks.sessionTokenPath
      - /data/callBackSessionToken
      - --log.json
      - --log.level
      - warn
      - --tajriba.log.level
      - warn
    ports:
      # Empirica Tajriba + participant client (single origin, all routes)
      - "${NAS_BIND_IP:?set the NAS static LAN IP}:3000:3000"
      # D-014: research-data export server (PII-redact by default,
      # audit log per download). Loopback-only inside container; the
      # LAN bind here is for direct researcher access + cloudflared
      # `exports.*` ingress from the public tunnel.
      - "${NAS_BIND_IP:?set the NAS static LAN IP}:3001:3001"
    volumes:
      - type: bind
        source: ${DELIBRA_DATA_DIR:?set DELIBRA_DATA_DIR}
        target: /data
      - type: bind
        source: ${DELIBRA_INTERNAL_BACKUP_DIR:?set DELIBRA_INTERNAL_BACKUP_DIR}
        target: /backups/internal
      - type: bind
        source: ${DELIBRA_EXTERNAL_BACKUP_DIR:?set DELIBRA_EXTERNAL_BACKUP_DIR}
        target: /backups/external
      - type: bind
        source: ${DELIBRA_CONFIG_FILE:?set DELIBRA_CONFIG_FILE}
        target: /run/secrets/empirica.toml
        read_only: true
      - type: bind
        source: ${DELIBRA_BACKUP_KEY_FILE:?set DELIBRA_BACKUP_KEY_FILE}
        target: /run/secrets/backup_passphrase
        read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 6g
    cpus: 3.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
