factors:
  - name: playerCount
    desc: Number of players per game
    values:
      - value: 3

  - name: gameDuration
    desc: Duration of the Task stage in minutes
    values:
      - value: 10

  - name: phase1Duration
    desc: Duration of the InitialDecision stage in minutes
    values:
      - value: 2

  - name: introDuration
    desc: Duration of the Introduction icebreaker stage in minutes
    values:
      - value: 2

  - name: hiddenInfoCue
    desc: Whether participants are told that others have different information
    values:
      - value: true

  - name: taskVersion
    desc: Which task/task materials this game uses (see server/src/TaskRegistry.js)
    values:
      - value: task1
      - value: task2

treatments:
  - name: main
    factors:
      playerCount:   3
      gameDuration:  10
      phase1Duration: 2
      introDuration: 2
      hiddenInfoCue: true