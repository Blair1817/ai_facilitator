factors:
  - name: playerCount
    desc: Number of players per game
    values:
      - value: 3

  - name: gameDuration
    desc: Duration of the Task stage in minutes
    values:
      - value: 10

  - name: phase1Duration
    desc: Duration of the InitialDecision stage in minutes
    values:
      - value: 2

  - name: introDuration
    desc: Duration of the Introduction icebreaker stage in minutes
    values:
      - value: 2

  - name: hiddenInfoCue
    desc: Whether participants are told that others have different information
    values:
      - value: true

# S1-S4 counterbalancing sequence assignment is NOT a treatment factor.
# server/src/callbacks.js's onGameStart allocates each Game's sequenceId
# itself (randomized-block allocator: SEQUENCES/SEQUENCE_IDS/
# claimNextSequence(), one Game claims one S1-S4 slot per 4-Game block) and
# persists it on the Game (game.set("sequenceId", ...)). This is
# independent of which treatment a Game runs -- there is a single source of
# truth (game.get("sequenceId")), not an Admin-configurable one.
treatments:
  - name: main
    factors:
      playerCount:   3
      gameDuration:  10
      phase1Duration: 2
      introDuration: 2
      hiddenInfoCue: true