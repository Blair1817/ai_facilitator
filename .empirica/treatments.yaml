factors:
  - name: playerCount
    desc: Number of players per game
    values:
      - value: 3

  - name: gameDuration
    desc: Duration of the Task stage in minutes
    values:
      - value: 10

  - name: phase1Duration
    desc: Duration of the InitialDecision stage in minutes
    values:
      - value: 2

  - name: introDuration
    desc: Duration of the Introduction icebreaker stage in minutes
    values:
      - value: 2

  - name: hiddenInfoCue
    desc: Whether participants are told that others have different information
    values:
      - value: true

  - name: sequenceId
    desc: >
      Counterbalancing sequence (S1-S4, see server/src/Counterbalancing.mjs)
      determining which Round is Static vs Adaptive facilitation and which
      Round runs Task A vs Task B. Replaces the previous study-level
      allocation ledger -- assigning games across these four treatments
      (e.g. via Batch treatment counts in the Admin panel) is how
      counterbalancing is now achieved, natively, by Empirica itself.
    values:
      - value: S1
      - value: S2
      - value: S3
      - value: S4

treatments:
  - name: sequence-S1
    factors:
      playerCount:   3
      gameDuration:  10
      phase1Duration: 2
      introDuration: 2
      hiddenInfoCue: true
      sequenceId: S1

  - name: sequence-S2
    factors:
      playerCount:   3
      gameDuration:  10
      phase1Duration: 2
      introDuration: 2
      hiddenInfoCue: true
      sequenceId: S2

  - name: sequence-S3
    factors:
      playerCount:   3
      gameDuration:  10
      phase1Duration: 2
      introDuration: 2
      hiddenInfoCue: true
      sequenceId: S3

  - name: sequence-S4
    factors:
      playerCount:   3
      gameDuration:  10
      phase1Duration: 2
      introDuration: 2
      hiddenInfoCue: true
      sequenceId: S4